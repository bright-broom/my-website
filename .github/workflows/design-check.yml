name: Code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Playwright builds and starts the production server before testing.
      - run: npm run test:behavior
